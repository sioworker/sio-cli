name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: build
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*} arch=${t#*/} ext=
            [ $os = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags=-s -o dist/sio-$os-$arch$ext ./cmd/sio
          done
          cd dist && sha256sum * > sha256sums.txt
      - name: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=AUTOBUILD-${{ github.run_number }}-${GITHUB_SHA::7}
          gh release create $tag dist/* --target $GITHUB_SHA --prerelease --title "$tag" --notes "$(git log -1 --format=%s)"
