name: lang

on:
  push:
    branches: [main]
    paths: ['lang/**', lang.go, lang_test.go]
  pull_request:
    paths: ['lang/**', lang.go, lang_test.go]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run "Lang|Jsonc" -v .
